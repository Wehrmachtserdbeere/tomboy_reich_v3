l_english:
  ENG_LEADER_OSWALD_MOSLEY_NAME: "Oswald Mosley"
  ENG_LEADER_OSWALD_MOSLEY_DESC: "Having brought the British Union of Fascists to power, Sir Oswald Mosley seeks to fundamentally transform the British state. A committed fascist and advocate of national syndicalism, he envisions a centralized, authoritarian government organized around national unity, industrial cooperation, and the supremacy of the state. His economic policies emphasize public works, strategic industrial planning, and the replacement of parliamentary party politics with a corporatist system. His movement's antisemitic politics and hostility towards liberal democracy have also become defining features of the new regime. Believing that Britain has grown complacent and decadent, Mosley intends to restore its position as a great imperial power through discipline, mobilization, and national renewal.\n\n\"England is not finished. England is not dead. Send to all the world a message: England lives and marches on!\""

  ENG_LEADER_GEORGE_V_NAME: "George V"
  ENG_LEADER_GEORGE_V_DESC: "A veteran sovereign whose reign has encompassed the Great War and the Anime War, the transformation of the British Empire, and the emergence of a new political and economic order, George V remains the embodiment of continuity and national stability. A firm believer in duty, tradition, and constitutional government, he has carefully maintained the Crown's position above the increasingly complicated affairs of Parliament. Having witnessed the hardships of war and the struggles of the working classes, he regards the preservation of national unity as his foremost responsibility. Under his reign, the monarchy remains a powerful symbol of British identity, binding together the United Kingdom and its far-flung Dominions under a common Crown.\n\n\"I have always endeavoured to do my duty, and I shall continue to do so.\""

  ENG_LEADER_EDWARD_VIII_NAME: "Edward VIII"
  ENG_LEADER_EDWARD_VIII_DESC: "Having succeeded his father to the British throne, Edward VIII represents a new generation of monarchy, one less concerned with traditional royal formality and more interested in the everyday lives of ordinary people. Popular for his public appearances and visits to economically depressed communities, he seeks to establish a closer relationship between the Crown and its subjects. His preference for personal initiative and a more visible royal presence occasionally places him at odds with the traditional conventions of constitutional government. Nevertheless, Edward envisions a modernized monarchy capable of adapting to the changing conditions of the twentieth century, preserving the prestige of the Crown while making it more accessible to the nation it represents.\n\n\"A King should know his people, not merely rule over them.\""

  ENG_LEADER_GEORGE_VI_NAME: "George VI"
  ENG_LEADER_GEORGE_VI_DESC: "Having unexpectedly inherited the Crown following his brother's abdication, George VI has devoted himself to restoring confidence in the British monarchy. A reserved and conscientious sovereign, he places enormous importance upon duty, personal integrity, and the preservation of constitutional stability. His reign is defined by a particularly strong sense of national responsibility, with the Crown serving as a symbol of unity during periods of extraordinary uncertainty. Working closely with his government and maintaining a visible presence among his subjects, George VI seeks to reassure the British people that their institutions remain steadfast, even when the nation itself faces its greatest challenges.\n\n\"I ask you to place your confidence in me, as I place mine in the British people.\""

  ENG_LEADER_HARRY_POLLITT_NAME: "Harry Pollitt"
  ENG_LEADER_HARRY_POLLITT_DESC: "A former boilermaker, trade union organizer, and General Secretary of the Communist Party of Great Britain, Harry Pollitt has devoted his life to the organization of the working classes and the advancement of Communism. Having brought the British Communist movement under a disciplined revolutionary leadership, he now seeks to transform the country into a socialist state aligned with the Soviet Union. His government emphasizes the nationalization of major industries, centralized economic planning, workers' organization, and the dismantling of the old capitalist establishment. A committed Marxist-Leninist and outspoken opponent of fascism, Pollitt views the struggle for socialism as an international undertaking, one in which Britain must finally abandon the interests of its traditional ruling classes and embrace those of its workers.\n\n\"The working class must never surrender the future it has the power to build.\""

  ENG_LEADER_STANLEY_BALDWIN_NAME: "Stanley Baldwin"
  ENG_LEADER_STANLEY_BALDWIN_DESC: "A veteran Conservative politician and three-time Prime Minister, Stanley Baldwin has become one of the principal architects of modern British parliamentary government. A cautious and pragmatic statesman, he favors gradual reform, political moderation, and the preservation of Britain's established constitutional institutions. His administration seeks to maintain domestic stability through cooperation between the various political factions of the National Government, while gradually expanding national defence in response to the increasingly dangerous international situation. Although often criticized for his reluctance to embrace more radical solutions, Baldwin believes that Britain is best served by patience, compromise, and the careful preservation of its democratic traditions.\n\n\"Power is a great trust, and it must never be used without responsibility.\""

  ENG_LEADER_NEVILLE_CHAMBERLAIN_NAME: "Neville Chamberlain"
  ENG_LEADER_NEVILLE_CHAMBERLAIN_DESC: "Having succeeded Stanley Baldwin as Prime Minister, Neville Chamberlain brings an administrative and economically minded approach to the government of Britain. A firm believer in practical reform, he places considerable emphasis upon domestic development, industrial modernization, housing, and the improvement of living conditions. Abroad, he seeks to preserve European peace through negotiation and diplomacy, believing that another general war would bring destruction to an entire generation. His government nevertheless recognizes the growing danger posed by foreign rearmament and continues to strengthen Britain's military capabilities. Often criticized for his willingness to make concessions in pursuit of peace, Chamberlain remains determined to secure a stable international order without sacrificing the prosperity and security of the British people.\n\n\"There is no victory in a war that could have been prevented.\""