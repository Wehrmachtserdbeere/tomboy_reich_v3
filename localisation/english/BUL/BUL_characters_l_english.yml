l_english:
  BUL_LEADER_TSAR_BORIS_III_NAME: "Tsar Boris III."
  BUL_LEADER_TSAR_BORIS_III_DESC: "Son of Ferdinand I., Boris III. inherited a country crippled by the Treaty of Neuilly and various coups, the latest of which led by him. He rules as a de-facto absolute monarch, and the country is democratic in name only.\n\n\"My diplomats are pro-Anime, my generals are pro-CEU, and my people are pro-Soviet. As it seems, I'm the only Bulgarian that's pro-Bulgaria.\""
  BUL_LEADER_GEORGI_KYOSEIVANOV_NAME: "Georgi Kyoseivanov"
  BUL_LEADER_GEORGI_KYOSEIVANOV_DESC: "Despite having been the Prime Minister since 1935, Georgi Kyoseivanov is seen as little more than Tsar Boris III.'s puppet.\n\n\"The Tsar will have his will pushed through.\""
  BUL_LEADER_ALEKSANDAR_TSANKOV_NAME: "Aleksandar Tsankov"
  BUL_LEADER_ALEKSANDAR_TSANKOV_DESC: "Having served as the 21st Prime Minister of Bulgaria from 1923 until 1926, successfully suppressing the communists, and forming his version of the National Socialists, Aleksandar Tsankov is seen as a charismatic and effective leader for Bulgaria.\n\n\"For our beautiful Bulgaria, which can only rise with the aid of National Socialism.\""
  BUL_LEADER_GEORGI_DIMITROV_NAME: "Georgi Dimitrov"
  BUL_LEADER_GEORGI_DIMITROV_DESC: "Initially exiled by Aleksandar Tsankov, Georgi Dimitrov now rules Bulgaria with the soft, guiding hand only a hardline Stalinist could posess. Despite this, he has genuine love for his country and the greater south slavic race.\n\n\"The wheel of history moves on towards Soviet Europe, towards a World Union of Soviet Republics.\""
  BUL_LEADER_VALKO_CHERVENKOV_NAME: "Valko Chervenkov"
  BUL_LEADER_VALKO_CHERVENKOV_DESC: "A hardline Stalinist like his predecessor Georgi Dimitrov, Valko Chervenkov promotes rapid industrialization and closeness to the Soviet ideal.\n\n\"A politician is only as strong as his hand is iron.\""
  BUL_LEADER_SHUNA_TENSURA_NAME: "Shuna"
  BUL_LEADER_SHUNA_TENSURA_DESC: "A Majin of petite stature, she made her way into Bulgarian politics almost by accident. While traveling through Europe, the Bulgarians have taken a great liking to her, and her leadership abilities have quickly become apparent. This, along with her sweet and caring appearance, led to her ascendance into a political player.\n\n\"I am happy to ascend and lead this nation to prosperity.\""