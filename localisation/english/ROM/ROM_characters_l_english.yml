l_english:
  ROM_LEADER_KARL_II_OF_HOHENZOLLERN_SIGMARINGEN_NAME: "Karl II."
  ROM_LEADER_KARL_II_OF_HOHENZOLLERN_SIGMARINGEN_DESC: "Succeeding his family in a very chaotic series of scandals and unfortunate circumstances, King Karl II. of Hohenzollern-Sigmaringen rules Romania as his personal domain.\n\n\"Thank God for Romania, and thank the devil for Hungary.\""
  ROM_LEADER_MICHAEL_I_OF_HOHENZOLLERN_SIGMARINGEN_NAME: "Michael I."
  ROM_LEADER_MICHAEL_I_OF_HOHENZOLLERN_SIGMARINGEN_DESC: "Having reigned briefly as a child, King Michael succeeded his father, Karl II., as the King of Romania. Seeking a more pragmatic stance based on national survival, he's seen as skilled by some and pathetic by others.\n\n\"Tomorrow's world can not exist without morals, without faith and memory.\""
  ROM_LEADER_CORNELIU_ZELEA_CODREANU_NAME: "Corneliu Zelea Codreanu"
  ROM_LEADER_CORNELIU_ZELEA_CODREANU_DESC: "Leader of The Legion of the Archangel Michael and a charismatic Fascist, Corneliu Zelea Codreanu is a staunchly defends Romania from communism and seeks to re-establish Christianity as the highest ideal of Romania. Although not radically against them, he sees the Anime populations of the world as a spectrum ranging from potential allies to acute enemies of Christ and the state.\n\n\"If I had but one bullet and were faced by both an enemy and a traitor, I would let the traitor have it.\""
  ROM_LEADER_GHEORGHE_GHEORGHIU_DEJ_NAME: "Gheorghe Gheorghiu-Dej"
  ROM_LEADER_GHEORGHE_GHEORGHIU_DEJ_DESC: "A great supporter of Stalinism and underground communist veteran, Gheorghe has an iron fist to rule the nation with, and an unbreakable will that will shatter even the toughest anticommunist weapon.\n\n\"When necessary, we can also confiscate forests, but we don't write anything in the program so as not to scare them.\""
  ROM_LEADER_GHEORGHE_TATARESCU_NAME: "Gheorghe Tătărescu"
  ROM_LEADER_GHEORGHE_TATARESCU_DESC: "An avid anticommunist, Gheorghe Tătărescu is considered a cornerstone of Romanian democracy in the current day and as a man who would never cede even an inch of Romanian soil to foreign nations.\n\n\"When morning comes, Romania will stand as it always has: Great and glorious.\""
  ROM_LEADER_SHALLTEAR_BLOODFALLEN_NAME: "Shalltear Bloodfallen"
  ROM_LEADER_SHALLTEAR_BLOODFALLEN_DESC: "A proven vampire and passionate sadist, Shalltear is both feared and revered by the people of Romania. Some say her supporters believe to be spared by her, others say they specifically want to be lorded over by her. Regardless of why, her following is powerful and almost fanatic.\n\n\"Ah, my master, my beloved master, the only one whom I cannot rule over...\""