l_english:
  EST_LEADER_JAAN_TONISSON_NAME: "Jaan Tõnisson"
  EST_LEADER_JAAN_TONISSON_DESC: "Veteran statesman and determined defender of parliamentary government, Jaan Tõnisson believes that Estonia's independence is inseparable from the political freedoms of its people. Having opposed the authoritarian turn of the country, he now seeks to restore constitutional government and return Estonia to democratic rule.\n\n\"A nation is strongest when its people are free to decide their own future.\""
  EST_LEADER_ANDRES_LARKA_NAME: "Andres Larka"
  EST_LEADER_ANDRES_LARKA_DESC: "Hero of the Estonian War of Independence and leader of the Vaps movement, Andres Larka commands a fiercely nationalist and authoritarian vision for Estonia. Disillusioned with parliamentary politics, he believes that only a disciplined national government can restore Estonia to the strength its veterans fought to secure.\n\n\"We did not fight for independence merely to surrender our country to weak politicians.\""
  EST_LEADER_HENDRIK_ALLIK_NAME: "Hendrik Allik"
  EST_LEADER_HENDRIK_ALLIK_DESC: "A committed Estonian communist, Hendrik Allik leads the revolutionary movement against the existing orders. Convinced that Estonia's social and economic problems are rooted in capitalism, he seeks to bring the workers to power and establish a socialist state.\n\n\"The workers who build the country must have a hand in deciding its future.\""
  EST_LEADER_KONSTANTIN_PATS_NAME: "Konstantin Päts"
  EST_LEADER_KONSTANTIN_PATS_DESC: "Estonia's long-serving statesman and architect of the country's authoritarian order, Konstantin Päts believes that political stability is more important than the endless struggles of parliamentary politics. He seeks to preserve Estonia's independence by keeping the country united, neutral, and safely outside the conflicts threatening Europe.\n\n\"Estonia must remain master of her own destiny, whatever storms may gather beyond her borders.\""
  EST_LEADER_MAKISE_KURISU_NAME: "Kurisu Makise"
  EST_LEADER_MAKISE_KURISU_DESC: "A brilliant neuroscientist with little patience for political nonsense, Kurisu Makise has nevertheless found herself responsible for the future of an entire nation. Relying on reason, scientific progress, and Estonia's considerable intellectual potential, she intends to drag the country toward a modern and technologically advanced future.\n\n\"If we're going to change Estonia's future, we should at least have a hypothesis instead of experimenting randomly.\""