l_english:
  POR_LEADER_ANTONIO_SALAZAR_NAME: "António de Oliveira Salazar"
  POR_LEADER_ANTONIO_SALAZAR_DESC: "The architect of the Estado Novo, António de Oliveira Salazar has transformed Portugal into a centralized, authoritarian, and corporatist state. A staunch conservative and devout Catholic, he believes that the survival of the Portuguese nation depends upon discipline, financial stability, traditional values, and the subordination of individual interests to the greater good of the state. His government suppresses political extremism, restricts independent labor organizations, and maintains an extensive system of censorship and political surveillance. Abroad, he regards the spread of Communism and liberal republicanism as existential threats to European civilization, and has consequently aligned Portugal with the Nationalist forces in Spain. Under Salazar, Portugal shall remain orderly, prosperous, and proudly resistant to the ideological turmoil of the modern world.\n\n\"To govern is not to please everyone, but to ensure that the nation survives.\""

  POR_LEADER_BENTO_GONCALVES_NAME: "Bento António Gonçalves"
  POR_LEADER_BENTO_GONCALVES_DESC: "A former worker of the naval arsenals and General Secretary of the Portuguese Communist Party, Bento António Gonçalves has devoted his life to the organization and liberation of the Portuguese working classes. Having brought the fragmented Communist movement under a disciplined revolutionary leadership, he now seeks to dismantle the old social and economic order and establish a genuinely socialist Portugal. His government champions workers' rights, collective ownership of industry, agricultural reform, and the abolition of the privileges enjoyed by the aristocracy and bourgeoisie. A committed Marxist-Leninist, he regards the struggle against capitalism and fascism as inseparable from the international struggle for socialism. Portugal shall no longer belong to those who own it, but to those who build it.\n\n\"The working class must be the master of its own destiny.\""

  POR_LEADER_BERNARDINO_MACHADO_NAME: "Bernardino Machado"
  POR_LEADER_BERNARDINO_MACHADO_DESC: "Twice President of the Portuguese Republic, Bernardino Machado has returned to lead his country out of years of military dictatorship and authoritarian rule. A veteran republican and committed constitutionalist, he believes that political stability can only be achieved through representative government, civil liberties, and the restoration of democratic institutions. His administration seeks to reunite the fractured republican movement, guarantee freedom of the press and association, and establish a government accountable to the Portuguese people. Although he favors gradual reform over revolutionary upheaval, Machado remains determined to ensure that Portugal never again falls under the control of an unelected military or authoritarian government. The Republic must be rebuilt, not merely restored.\n\n\"The future of Portugal belongs to its people, and to no master but the law.\""

  POR_LEADER_LOUISE_FROIS_NAME: "Louise Frois"
  POR_LEADER_LOUISE_FROIS_DESC: "A devoted Christian and compassionate servant of the Portuguese people, Louise Frois has established an unusual government founded upon faith, charity, and the protection of the defenseless. Having spent much of her life helping the sick and those in need, she regards the welfare of the population as the foremost responsibility of any legitimate government. Her administration emphasizes religious education, charitable institutions, medical care, and the preservation of Christian values throughout Portuguese society. Neither particularly interested in the ambitions of politicians nor impressed by the rivalries of ideological movements, Louise seeks to guide Portugal towards a peaceful and spiritually renewed future. Her gentle disposition should not be mistaken for weakness, however; when the welfare of her people or the principles of her faith are threatened, she can be remarkably resolute.\n\n\"A nation is only as strong as the kindness it shows to its weakest.\""

  POR_LEADER_MONARCHIST_MOVEMENT_NAME: "Monarchist Movement"
  POR_LEADER_MONARCHIST_MOVEMENT_DESC: "With the Republican experiment having come to an end, the various monarchist factions of Portugal have united to oversee the restoration of the Crown. However, the question of succession remains unresolved. The Miguelist traditionalists favor Duarte Nuno, whilst the constitutional monarchists increasingly support Maria Pia as an alternative to the old royal establishment. Rather than allow these disagreements to fracture the restoration before it has even begun, the Monarchist Movement has established a provisional government tasked with maintaining national stability and determining the future sovereign. Whether through a royal council, parliamentary agreement, or popular consultation, Portugal must settle its dynastic question before the country can move forward. For now, the Crown belongs to the movement; soon, it must belong to someone.\n\n\"The monarchy shall return, but Portugal must first decide who wears its crown.\""

  POR_LEADER_DUARTE_NUNO_NAME: "Duarte II"
  POR_LEADER_DUARTE_NUNO_DESC: "As the head of the House of Braganza's Miguelist branch, Duarte II has restored the traditional monarchy and assumed the Portuguese throne. A firm believer in the historical and religious foundations of the Portuguese nation, he seeks to establish a government built upon Catholic values, royal authority, national unity, and respect for the country's historical institutions. His administration favors a strong Crown, a close relationship with the Church, and a hierarchical social order in which the interests of the nation take precedence over parliamentary rivalries and ideological divisions. Supported by traditionalist monarchists and conservative Catholic circles, Duarte II envisions a Portugal that looks towards its glorious past for the foundations of its future. The House of Braganza shall once again stand at the heart of the Portuguese state.\n\n\"A kingdom without tradition is a nation without its soul.\""

  POR_LEADER_MARIA_PIA_NAME: "Maria III"
  POR_LEADER_MARIA_PIA_DESC: "Claiming descent from King Carlos I and representing an alternative constitutional branch of the Portuguese royal tradition, Maria III has assumed the Crown with the ambition of establishing a modern and parliamentary monarchy. Rejecting the notion that royal authority must necessarily entail absolute political power, she seeks to reconcile the historical prestige of the Portuguese Crown with the principles of constitutional government and civil liberty. Her administration favors parliamentary representation, political pluralism, modernization, and a clear distinction between the responsibilities of the sovereign and those of the elected government. Although her accession has provoked considerable opposition amongst traditionalist circles, Maria III believes that the monarchy can only survive by adapting to the needs of the modern Portuguese nation. A new dynasty, a new constitution, and a new beginning await Portugal.\n\n\"A Crown is not a privilege to be possessed, but a responsibility to be fulfilled.\""