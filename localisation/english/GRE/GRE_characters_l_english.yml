l_english:
  GRE_LEADER_IOANNIS_METAXAS_NAME: "Ioannis Metaxas"
  GRE_LEADER_IOANNIS_METAXAS_DESC: "Having established the Fourth of August Regime, Ioannis Metaxas has transformed Greece into a centralized, authoritarian state founded upon nationalism, discipline, and traditional Greek values. A former general and staunch monarchist, he believes that the country's survival depends upon the suppression of ideological divisions and the subordination of individual interests to the greater national good. His government promotes corporatism, military preparedness, state-directed economic development, and the cultivation of a new generation of disciplined Greek citizens through organizations such as the National Youth Organisation. Political opposition, independent labor movements, and Communist organizations are systematically suppressed, while the press and public institutions are brought under state supervision. Seeking to revive the perceived greatness of ancient Sparta and the Byzantine Empire, Metaxas envisions a new Greece united under an authoritarian national state.\n\n\"Discipline, national unity, and the preservation of our Greek heritage shall be the foundations of our future!\""

  GRE_LEADER_GEORGIOS_TSOLAKOGLOU_NAME: "Georgios Tsolakoglou"
  GRE_LEADER_GEORGIOS_TSOLAKOGLOU_DESC: "A career military officer who rose to prominence during the Greco-Italian War, Georgios Tsolakoglou has assumed control of the Hellenic State following the collapse of organized Greek resistance. Having personally negotiated the surrender of Greek forces to the Wehrmacht, he now presides over an administration operating under the authority of the occupying powers. His government seeks to maintain the remaining institutions of the Greek state, restore administrative order, and secure the continued functioning of essential services under extraordinarily difficult circumstances. In practice, however, its authority remains severely restricted by German interests, and its dependence upon the occupation authorities leaves little room for genuine national independence. Tsolakoglou's rule represents the painful reality of a Greece forced to govern itself under foreign domination.\n\n\"A government without sovereignty must at least preserve the foundations of the nation.\""

  GRE_LEADER_NIKOS_ZACHARIADIS_NAME: "Nikos Zachariadis"
  GRE_LEADER_NIKOS_ZACHARIADIS_DESC: "General Secretary of the Communist Party of Greece, Nikos Zachariadis has dedicated his political career to the organization of the working classes and the establishment of a socialist society. A committed Marxist-Leninist and supporter of the Soviet Union, he seeks to dismantle the old economic and political establishment and replace it with a centralized workers' state. His administration emphasizes public ownership of major industries, agricultural reform, workers' organizations, and the elimination of the privileges enjoyed by the traditional ruling classes. Firmly opposed to monarchism, capitalism, and fascism, Zachariadis believes that Greece must become an active participant in the international Communist movement. Under his leadership, the country is to undergo a comprehensive political, economic, and social transformation.\n\n\"The workers of Greece shall no longer serve their masters; they shall govern their own future!\""

  GRE_LEADER_THEMISTOKLIS_SOFOULIS_NAME: "Themistoklis Sophoulis"
  GRE_LEADER_THEMISTOKLIS_SOFOULIS_DESC: "A veteran of Greek parliamentary politics and leader of the Liberal Party, Themistoklis Sophoulis has devoted his government to the restoration and preservation of constitutional democracy. A moderate republican and advocate of political compromise, he believes that Greece can only overcome its longstanding divisions through representative institutions, civil liberties, and responsible parliamentary government. His administration seeks to restore the independence of the judiciary, guarantee freedom of expression and association, and reunite the various democratic factions under a common constitutional framework. Although willing to cooperate with moderate socialists and reformers, Sophoulis rejects both Communist revolutionary authoritarianism and the military dictatorship of the previous regime. His greatest ambition is to establish a stable democratic Greece in which political disagreements are settled through Parliament rather than through force.\n\n\"A government must answer to its people, not demand that its people answer to it.\""

  GRE_LEADER_GEORGE_II_NAME: "George II"
  GRE_LEADER_GEORGE_II_DESC: "Restored to the Greek throne after more than a decade of republican government, George II represents the revival of the Hellenic monarchy and the traditional institutions of the Greek state. Having experienced exile, political instability, and the repeated collapse of successive governments, he considers a strong Crown essential to maintaining national unity and political order. His government enjoys the support of the military establishment, conservative political circles, and traditional royalist institutions. Although the monarchy retains a constitutional framework in principle, George II has demonstrated his willingness to support direct royal intervention in national affairs, most notably through his backing of the Fourth of August Regime. Under his reign, the Crown once again stands at the centre of Greek political life, with the preservation of the dynasty and the stability of the kingdom taking precedence over parliamentary convention.\n\n\"The Crown must remain the guardian of Greece, through prosperity and adversity alike.\""

  GRE_LEADER_HRAFNHILDR_NAME: "Hrafnhildr"
  GRE_LEADER_HRAFNHILDR_DESC: "Emerging from the ancient traditions of the Varangian warriors who once guarded the emperors of Constantinople, Hrafnhildr has laid claim to the throne of the Byzantine Empire. A cold and austere sovereign, she regards the Roman imperial inheritance not as a relic of the past, but as a responsibility that must be reclaimed through strength, discipline, and unwavering resolve. Her government is built around military hierarchy, absolute loyalty to the sovereign, and the restoration of the imperial institutions that once commanded the Mediterranean and beyond. Beneath the Raven's dark banners, the remnants of the Byzantine legacy are gathered into a new imperial order, one that draws upon both the traditions of Constantinople and the martial heritage of the northern warriors who once defended it. To Hrafnhildr, the empire was never truly dead; it was merely waiting for someone worthy of its throne.\n\n\"The Raven remembers what the world has forgotten. Constantinople shall rise once more, and the Empire shall have its Empress.\""
