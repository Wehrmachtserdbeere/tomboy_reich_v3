l_english:
  LIT_LEADER_KAZYS_GRINIUS_NAME: "Kazys Grinius"
  LIT_LEADER_KAZYS_GRINIUS_DESC: "Having studied medicine in Moscow, later taking part in Lithuanian nationalist political activities, and helping to establish the independence of Lithuania, Kazys Grinius is already considered a national hero within Lithuania. He seeks to protect the country from foreign invasion and subversion, and to uphold democracy as a Lithuanian virtue.\n\n\"It can only be too late to talk about democracy, to fight for democracy, but never too early.\""
  LIT_LEADER_AUGUSTINAS_VOLDEMARAS_NAME: "Augustinas Voldemaras"
  LIT_LEADER_AUGUSTINAS_VOLDEMARAS_DESC: "A supporter of Lithuanian nationalism, irredentism, and fascism, Augustinas Voldemaras is a controversial yet popular politician in Lithuania, only aided by the fact that he acted as the first Prime Minister of the recently independent country.\n\n\"Glorious Lithuania, freed again, you will shine forevermore.\""
  LIT_LEADER_ANTANAS_SNIECKUS_NAME: "Antanas Sniečkus"
  LIT_LEADER_ANTANAS_SNIECKUS_DESC: "Enamoured by the Bolsheviks since he was 16 years old, Antanas Sniečkus is the shining example of Lithuanian marxism and anti-fascism. Dedicated to the Soviet cause, he seeks to integrate Lithiania as either a Socialist Republic of the Soviet Union, or as its own independent, Soviet Republic.\n\n\"The workers of Lithuania have united, with or without their consent.\""
  LIT_LEADER_KARL_GERO_NAME: "Mindaugas III."
  LIT_LEADER_KARL_GERO_DESC: "Mindaugas III., also known under his true name Karl Gero, Duke of Urach, is the son of Wilhelm Karl who was the briefly-elected King of Lithuania, under the name of Mindaugas II. Having served as Lieutenant during the Great War, and expelled from the Central European Union following his refusal to hand over §CHomo Nihonensis§! refugees from his family's estate during the §RAnime War§!, he became a General for the Lithuanian military, and a symbol for the safety of minority populations in Lithuania.\n\n\"With God as my witness, I swear I shall defend Lithiania with my blood, sweat, and tears!\""
  LIT_LEADER_TORIS_LAURINAITIS_NAME: "Toris Laurinaitis"
  LIT_LEADER_TORIS_LAURINAITIS_DESC: "Being drawn to the Lithuanian nation soon after the Arrival, he described himself as Lithuania's personification. Despite initial outrage over such grandiose statements, many people have gotten accustomed to it. Some people consider his claim to be true, citing his excellent language skills, deep knowledge of Lithuanian history, and great charisma as evidence for this."