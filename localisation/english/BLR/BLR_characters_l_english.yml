l_english:
  BLR_LEADER_FABIAN_AKINCYC_NAME: "Fabian Akinčyc"
  BLR_LEADER_FABIAN_AKINCYC_DESC: "Founder and principal ideologue of the Belarusian National Socialist movement, Fabian Akinčyc seeks to establish a new Belarusian state founded upon nationalism, authoritarianism, and national syndicalism. Having abandoned his earlier revolutionary convictions, he has embraced the belief that Belarusian independence can only be achieved through the complete mobilization of the national community. His government emphasizes centralized authority, corporatist economic organization, nationalist education, and the subordination of individual interests to the state. Fiercely anti-Communist and openly antisemitic, Akinčyc envisions a Belarusian national revival inspired by the political developments of Germany, with the ultimate ambition of securing an independent Belarus under a strong national government. Under his leadership, the Belarusian people shall be united under one flag, one state, and one national ideology.\n\n\"A nation without unity is a nation without a future.\""

  BLR_LEADERS_KONSTANTY_YUSHNEVICH_NAME: "Konstanty Yuzhnevich"
  BLR_LEADERS_KONSTANTY_YUSHNEVICH_DESC: "A radical nationalist and associate of the Belarusian National Socialist movement, Konstanty Yuzhnevich represents the more uncompromising elements of the Belarusian independence struggle. Rejecting parliamentary liberalism and Communist internationalism alike, he believes that the survival of the Belarusian nation requires a centralized state, strict political discipline, and the elimination of forces considered hostile to national unity. His administration places particular emphasis upon the organization of the national movement, the strengthening of state institutions, and the cultivation of an uncompromising Belarusian national identity. Although his political ambitions are rooted in the same nationalist principles as Akinčyc's, Yuzhnevich favors a particularly rigid and militant interpretation of the national struggle. Belarus must not merely exist as a state; it must become a nation prepared to defend its existence at any cost.\n\n\"The destiny of Belarus shall never again be decided by foreign masters!\""

  BLR_LEADER_NIKOLAI_GIKALO_NAME: "Nikolai Gikalo"
  BLR_LEADER_NIKOLAI_GIKALO_DESC: "A veteran Bolshevik revolutionary and First Secretary of the Communist Party of Byelorussia, Nikolai Gikalo has dedicated his administration to the transformation of Belarus into a modern Soviet republic. A committed Marxist-Leninist, he emphasizes rapid industrialization, agricultural collectivization, centralized economic planning, and the expansion of Soviet institutions throughout the country. His government seeks to dismantle the remaining influence of traditional landowners, religious authorities, and independent political organizations, integrating Belarus more closely into the economic and political structure of the Soviet Union. While the party promotes literacy, industrial development, and the construction of a socialist society, its increasingly centralized administration leaves little room for political or cultural independence outside the approved Soviet framework. Under Gikalo, Belarus shall be transformed into an integral part of the socialist future.\n\n\"The old world must give way to a new one, built by the workers and peasants!\""

  BLR_LEADER_MAKAR_LYSENKO_NAME: "Makar Lysenko"
  BLR_LEADER_MAKAR_LYSENKO_DESC: "Leader of the Russian Monarchist Movement and self-appointed guardian of the imperial restoration, Makar Lysenko has established an authoritarian state dedicated to preparing the return of the Romanov dynasty. A ruthless centralizer who regards parliamentary politics and popular sovereignty as obstacles to national recovery, he has concentrated political, military, and administrative authority into his own hands. His government promotes Russian national identity, Orthodox Christianity, military discipline, and the preservation of traditional imperial institutions. Political opposition is tolerated only insofar as it does not threaten the movement's ultimate objectives, while the armed forces and security apparatus remain firmly under his personal control. Yet Lysenko does not intend to wear the crown himself. His ambition is to restore the Empire, secure its foundations, and determine the circumstances under which the rightful sovereign shall return. Whether the future Tsar will find a loyal servant or an unwilling subordinate upon his arrival remains to be seen.\n\n\"The Empire shall return. Until that day, I alone shall ensure that it survives.\""

  BLR_LEADER_KIRILL_VLADIMIROVICH_NAME: "Tsar Cyril I"
  BLR_LEADER_KIRILL_VLADIMIROVICH_DESC: "Having asserted his position as the rightful successor to the Russian imperial throne, Tsar Cyril I has returned to reclaim the imperial inheritance of the Romanov dynasty. A firm believer in dynastic legitimacy, Orthodox Christianity, and the historical traditions of the Russian Empire, he seeks to restore the institutions that once governed the vast territories of the Tsar's dominions. His administration emphasizes centralized imperial authority, cooperation with the Orthodox Church, the restoration of traditional institutions, and the re-establishment of the monarchy as the foundation of national unity. Regarding the revolution as a catastrophic betrayal of Russian history, Cyril is determined to reverse its consequences and reunite the former imperial territories under the Romanov Crown. Belarus, with its historical ties to the Russian Empire, occupies an important position in his vision of imperial restoration. The Romanov dynasty has returned, and with it comes the promise of a restored Empire.\n\n\"I have inherited not merely a throne, but the sacred responsibility of preserving the Russian Empire.\""

  BLR_LEADER_VLADIMIR_KIRILLOVICH_NAME: "Tsar Vladimir III"
  BLR_LEADER_VLADIMIR_KIRILLOVICH_DESC: "The successor to Cyril I and representative of a new generation of the Romanov dynasty, Tsar Vladimir III has inherited the enormous responsibility of restoring the Russian Empire to its former standing. Unlike the older generation of imperial exiles, Vladimir represents a monarchy seeking to reconcile its historical traditions with the realities of the modern world. Although firmly committed to dynastic legitimacy and the preservation of imperial institutions, he recognizes that the restoration of the old Empire cannot rely solely upon nostalgia and inherited authority. His government seeks to modernize the military, strengthen national industry, restore the prestige of the Crown, and gradually consolidate the territories once belonging to the Russian Empire. A younger sovereign surrounded by the remnants of an older political order, Vladimir must prove that the Romanov dynasty can offer more than a return to the past. His reign shall determine whether the Empire becomes a relic restored or a nation reborn.\n\n\"The Empire belongs neither to the past nor to its memories. It belongs to those who shall build its future.\""

  BLR_LEADER_JANKA_PAZNIAK_NAME: "Janka Pazniak"
  BLR_LEADER_JANKA_PAZNIAK_DESC: "A prominent figure of the Belarusian national movement and leader of Belarusian National Unification, Janka Pazniak has dedicated his political career to securing the independence and cultural survival of the Belarusian people. A committed national democrat, he believes that Belarus must establish its own sovereign institutions rather than remain subordinate to either Warsaw or Moscow. His administration emphasizes national education, the preservation and promotion of the Belarusian language, independent political institutions, and the development of a unified national identity. Although rooted in the Christian democratic tradition, his political vision extends beyond religious and regional divisions, seeking to unite Belarusian society around the common objective of national independence. Having endured years of foreign political domination, Belarus must finally determine its own destiny.\n\n\"A nation that forgets its language and history will eventually forget that it is a nation.\""

  BLR_LEADER_ADAM_STANKIEWICZ_NAME: "Adam Stankiewicz"
  BLR_LEADER_ADAM_STANKIEWICZ_DESC: "A Catholic priest, intellectual, and one of the founders of Belarusian Christian Democracy, Adam Stankiewicz envisions an independent Belarus founded upon Christian morality, democratic institutions, and national self-determination. His government emphasizes religious freedom, education, social responsibility, and the preservation of Belarusian cultural traditions. A committed advocate of the Belarusian language and an opponent of both Soviet Communism and authoritarian nationalism, he seeks to create a political system in which the dignity of the individual and the independence of the nation are equally protected. Rather than pursuing national unity through force or ideological conformity, Stankiewicz believes that Belarus must be built through education, civic participation, and respect for its historical and religious heritage. His ideal state is one in which Christianity and democracy provide the moral foundations of national independence.\n\n\"Our nation shall stand upon faith, freedom, and the dignity of its people.\""

  BLR_LEADER_HOLO_NAME: "Holo"
  BLR_LEADER_HOLO_DESC: "An ancient spirit of the harvest who has assumed the responsibility of governing Belarus, Holo approaches the affairs of state with the wisdom of someone who has watched generations of rulers rise and disappear. Possessing an intimate understanding of agriculture, trade, and the natural cycles upon which civilization depends, she believes that a country's prosperity must begin with the well-being of its people and the fertility of its lands. Her administration emphasizes agricultural development, rural prosperity, regional commerce, and the preservation of ancient traditions and folklore. Although she often appears playful, lazy, and somewhat self-indulgent, her centuries of experience have made her a remarkably perceptive negotiator and a shrewd judge of character. She has little patience for unnecessary conflict or the foolish ambitions of mortal rulers, preferring instead a prosperous country where the harvest is plentiful, the markets are lively, and the people have reason to celebrate. Under the watchful eye of the Wise Wolf, Belarus shall enjoy a new age of prosperity.\n\n\"A good harvest, a full purse, and a little wine. What more could a wise wolf possibly desire?\""