l_english:
  SPA_LEADER_ALFONSO_XIII_NAME: "Alfonso XIII."
  SPA_LEADER_ALFONSO_XIII_DESC: "Restored to the Spanish throne after years of exile, Alfonso XIII seeks to rebuild the prestige and authority of the Spanish Crown. A conservative monarchist with considerable experience in the affairs of state, he believes that Spain's salvation lies in restoring traditional institutions, strengthening the military, and re-establishing the historical relationship between the Monarchy and the Catholic Church. Having witnessed the collapse of his previous reign, he is determined not to repeat the mistakes that cost him his throne. However, the political and social forces that brought down the old monarchy have hardly disappeared.\n\n\"I do not renounce any of my rights, because they are more than mine; they are a deposit accumulated by History.\""

  SPA_LEADER_FRANCISCO_FRANCO_NAME: "Francisco Franco"
  SPA_LEADER_FRANCISCO_FRANCO_DESC: "Generalísimo Francisco Franco has brought the military, nationalists, monarchists, and traditionalists together under a single banner. A veteran of the African campaigns and a staunch defender of Spanish national unity, he believes that only a centralized, authoritarian state can restore order to a country torn apart by ideological conflict. His government emphasizes military discipline, Catholic values, traditional social structures, and the suppression of revolutionary movements. Although his political vision is relatively conservative, his determination to preserve the Spanish nation leaves little room for dissent. Under Franco, Spain will know order, whether it wishes to or not.\n\n\"Spain is one, great and free!\""

  SPA_LEADER_DOLORES_IBARRURI_NAME: "Dolores Ibárruri"
  SPA_LEADER_DOLORES_IBARRURI_DESC: "Known throughout the working classes as 'La Pasionaria', Dolores Ibárruri has become the voice and symbol of the Spanish Revolution. A committed Marxist-Leninist and a devoted adherent of the international Communist movement, she seeks to transform Spain into a socialist state in which the old aristocracy, industrial elites, and established institutions have no place. Her government champions workers' rights, land redistribution, the nationalization of industry, and the construction of a society founded upon socialist principles. Fiercely opposed to fascism and reactionary conservatism, Ibárruri considers the struggle for socialism inseparable from the struggle for Spain itself.\n\n\"It is better to die standing than to live kneeling!\""

  SPA_LEADER_DIEGO_MARTINEZ_BARRIO_NAME: "Diego Martínez Barrio"
  SPA_LEADER_DIEGO_MARTINEZ_BARRIO_DESC: "A veteran of the Republican movement and a committed defender of parliamentary government, Diego Martínez Barrio seeks to preserve the Spanish Republic through moderation, compromise, and constitutional reform. His administration emphasizes civil liberties, political pluralism, and the preservation of democratic institutions, rejecting both revolutionary authoritarianism and military dictatorship. Faced with an increasingly polarized nation, he seeks to bring together liberals, moderate socialists, and republican reformers under a common national government. His greatest challenge lies in maintaining the legitimacy of a democratic state while its more radical opponents increasingly question the very idea of compromise.\n\n\"A republic cannot survive without the rule of law.\""

  SPA_LEADER_ED_BEBOP_NAME: "Edward Wong Hau Pepelu Tivrusky IV"
  SPA_LEADER_ED_BEBOP_DESC: "An eccentric young prodigy with an extraordinary talent for codes, communications, and machinery, Edward is perhaps the most unconventional ruler Spain has ever known. Having assumed control of the Spanish state, she approaches the administration of the country as one enormous intellectual experiment. Traditional political doctrines, economic conventions, and established bureaucratic procedures hold little appeal for her; instead, she favors technological advancement, unconventional solutions, and an almost incomprehensible approach to statecraft. Her government is as unpredictable as its leader, but beneath the apparent madness lies an extraordinary intellect capable of seeing solutions where others see only insurmountable problems. Spain has never been governed quite like this before.\n\n\"Edward thinks, Edward sees, Edward solves!\""