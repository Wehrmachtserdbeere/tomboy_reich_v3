l_english:
  LAT_LEADER_PAULS_KALNINS_NAME: "Pauls Kalniņš"
  LAT_LEADER_PAULS_KALNINS_DESC: "A lifelong advocate of parliamentary democracy, Pauls Kalniņš believes that Latvia's independence can only endure when its people are allowed to govern themselves through free institutions. Opposed to Ulmanis' authoritarian rule, he seeks to restore the democratic republic that existed before the coup.\n\n\"A free Latvia must be governed by its people, not merely in their name.\""
  LAT_LEADER_GUSTAVS_CELMINS_NAME: "Gustavs Celmiņš"
  LAT_LEADER_GUSTAVS_CELMINS_DESC: "Radical Latvian nationalist and leader of Perkonkrusts, Gustavs Celmiņš dreams of replacing the old parliamentary order with an authoritarian national state. Fiercely anti-communist and hostile to liberal democracy, he considers Latvian nationalism the foundation upon which a stronger Latvia must be built.\n\n\"A nation that does not defend itself will soon have nothing left to defend.\""
  LAT_LEADER_JANIS_KALNBERZINS_NAME: "Jānis Kalnbērziņš"
  LAT_LEADER_JANIS_KALNBERZINS_DESC: "Operating from the shadows, the Latvian communists, led by Jānis Kalnbērziņš, seek to overthrow the existing political order and replace it with a state founded upon Marxist principles. Though their movement remains disliked by many, they continue to organize in the hope that Latvia's workers will struggle against the bourgeois state.\n\n\"The old order may silence our voices, but it cannot silence history.\""
  LAT_LEADER_KARLIS_ULMANIS_NAME: "Kārlis Ulmanis"
  LAT_LEADER_KARLIS_ULMANIS_DESC: "Long-serving Latvian statesman and the country's de facto leader, Kārlis Ulmanis has come to believe that parliamentary politics are ill-suited for protecting Latvia's independence. Having established an authoritarian government, he seeks to preserve Latvian sovereignty, stability, and national unity above all else.\n\n\"Latvia must belong to the Latvians, and its future must be built by our own hands.\""
  LAT_LEADER_REI_AYANAMI_NAME: "Rei Ayanami"
  LAT_LEADER_REI_AYANAMI_DESC: "Quiet and seemingly detached, Rei Ayanami approaches the question of national leadership with the same reserved pragmatism with which she approaches everything else. She has little interest in political spectacle or personal glory, instead seeking a stable Estonia capable of surviving whatever dangers may emerge around it.\n\n\"I don't need to be important. If Estonia can remain standing, that is enough.\""